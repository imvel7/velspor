name: Aylik Fikstur
on:
  schedule:
    - cron: "0 6 1 * *"   # her ayin 1'i, Turkiye saati 09:00
  workflow_dispatch:
    inputs:
      ay: {description: "Ay (2026-11). Bos = bu ay", default: ""}
concurrency:
  group: mac
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fikstur:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pillow numpy
      - run: python fikstur.py
        env:
          AY: ${{ inputs.ay }}
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: always()
        run: |
          git config user.name "velspor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "fikstur" && git pull --rebase -q && git push -q)
