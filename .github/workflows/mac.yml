name: Mac izleyici
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mod:
        description: "test / tekrar / izle / otomatik"
        default: "test"
      mac_id:
        description: "Mac numarasi (tekrar ve izle icin)"
        default: ""
      takim:
        description: "Bizim takim numarasi (bos = Galatasaray)"
        default: ""
concurrency:
  group: mac
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  izle:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python canli.py
        env:
          MOD: ${{ inputs.mod || 'otomatik' }}
          MAC_ID: ${{ inputs.mac_id }}
          TAKIM: ${{ inputs.takim }}
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: always()
        run: |
          git config user.name "velspor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "mac durumu" && git pull --rebase -q && git push -q)
