name: Vel Spor Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      health:
        description: "Kaynak sağlık raporu gönderilsin mi?"
        type: boolean
        default: true
      headline:
        description: "ELLE KART için başlık (boş bırakırsan haber taraması yapılır)"
        type: string
        required: false
      category:
        description: "Elle kart kategorisi"
        type: choice
        options:
          - Maç İçi
          - Maç Öncesi
          - Transfer
          - Oyuncu Performansı
          - Disiplin ve Ceza
          - Sakatlık
          - Kulüp ve Yönetim
          - Özel Gün
          - Puan Durumu
          - Antrenman
          - Taraftar ve Stadyum
          - Açıklamalar
          - Avrupa
          - Gündem
      level:
        description: "Önem: A son dakika, B gündem, C arşiv"
        type: choice
        options: ["A", "B", "C"]
      source:
        description: "Elle kart kaynağı"
        type: string
        default: "Vel Spor"
      claim:
        description: "İDDİA rozeti eklensin mi?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: velspor-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekenleri kur
        run: |
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow

      - name: Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTH_REPORT: ${{ inputs.health && '1' || '0' }}
          HEADLINE: ${{ inputs.headline }}
          CATEGORY: ${{ inputs.category }}
          LEVEL: ${{ inputs.level }}
          SOURCE: ${{ inputs.source }}
          CLAIM: ${{ inputs.claim }}
        run: python velspor.py

      - name: Durumu kaydet
        run: |
          if [ -f state/seen.json ]; then
            git config user.name "velspor-bot"
            git config user.email "velspor-bot@users.noreply.github.com"
            git add state/seen.json
            git diff --cached --quiet || (git commit -m "state" && git push)
          fi
