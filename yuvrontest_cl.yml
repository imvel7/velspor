name: Yuvron testi
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python yuvrontest3.py
        env:
          YUVRON_KEY: ${{ secrets.YUVRON_KEY }}
